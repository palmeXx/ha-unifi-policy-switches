name: Tests

# Runs the same targets as locally:
# - make test: test suite on the newest Home Assistant version with a
#   pytest-homeassistant-custom-component release
# - make smoke: smoke test on the newest Home Assistant release
# A manual run can set both versions.

on:
  # Other branches are tested by their pull request, tags by the release
  # workflow
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test_ha:
        description: Home Assistant version of the test suite, the newest by default
        type: string
        default: ""
      smoke_ha:
        description: Home Assistant version of the smoke test, the newest by default
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: Git ref to test, the triggering ref by default
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Select Home Assistant version
        id: ha
        env:
          HA: ${{ inputs.test_ha }}
        run: |
          version=${HA:-$(python scripts/versions.py newest-test-ha)}
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: make test HA=${{ steps.ha.outputs.version }}
        env:
          HA: ${{ steps.ha.outputs.version }}
        run: make test HA="$HA" PYTHON=python

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Select Home Assistant version
        id: ha
        env:
          HA: ${{ inputs.smoke_ha }}
        run: |
          version=${HA:-$(python scripts/versions.py newest-ha)}
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: make smoke HA=${{ steps.ha.outputs.version }}
        env:
          HA: ${{ steps.ha.outputs.version }}
        run: make smoke HA="$HA" PYTHON=python
