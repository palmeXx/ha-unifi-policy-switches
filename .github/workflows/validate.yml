name: Validate

on:
  # Other branches are validated by their pull request, tags by the release
  # workflow
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate, the triggering ref by default
        type: string
        default: ""

permissions: {}

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      # Validates the repository at the triggering ref through the GitHub API
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: home-assistant/actions/hassfest@master
